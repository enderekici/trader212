services:
  bot:
    image: ghcr.io/enderekici/trader212:main
    env_file: .env
    volumes:
      - ./data:/app/data
    ports:
      - "3001:3001"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/status').then(r=>{if(!r.ok)throw 1})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  web:
    image: ghcr.io/enderekici/trader212:main-web
    environment:
      - API_URL=http://bot:3001
      - API_SECRET_KEY=${API_SECRET_KEY:-}
      - HOSTNAME=0.0.0.0
    ports:
      - "3000:3000"
    depends_on:
      bot:
        condition: service_healthy
    restart: unless-stopped
